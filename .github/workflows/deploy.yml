name: deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v6

      - name: 이미지 태그 설정
        id: meta
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Java 21 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: ./greadlew 실행 권한 부여
        run: chmod +x ./gradlew

      - name: 테스트
        run: ./gradlew clean test

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/subscription-backend:${{ steps.meta.outputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/subscription-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: SSH 준비
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: EC2 배포
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
          TAG: ${{ needs.build-and-push.outputs.image_tag }}
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          ssh "$USER@$HOST" "
            set -e
            cd /home/ubuntu/subscription

            echo \$GHCR_TOKEN | docker login ghcr.io -u \$GHCR_USERNAME --password-stdin

            docker compose pull spring
            docker compose up -d spring
          "
